name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test the CLI
        shell: bash
        run: |
          python tests/fixtures.py smoke
          python -m doc2md smoke/report.pdf --charts
          test -f smoke/report_doc2md/report.md
          python -m doc2md smoke/deck.pptx --charts
          test -f smoke/deck_doc2md/deck.md
