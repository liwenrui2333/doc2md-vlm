name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest moved to 26.04, where setup-python no longer
          # provides 3.9. Pin an older image for the oldest supported version.
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: macos-15
            python: "3.9"
          - os: macos-15
            python: "3.12"
          - os: macos-15
            python: "3.13"
          # Newest interpreter, to catch deprecation guards failing open.
          - os: ubuntu-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test the CLI
        shell: bash
        run: |
          python tests/fixtures.py smoke
          python -m doc2md smoke/report.pdf --charts
          test -f smoke/report_doc2md/report.md
          python -m doc2md smoke/deck.pptx --charts
          test -f smoke/deck_doc2md/deck.md
